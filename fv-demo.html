<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>トップ画面 3案くらべ｜ENVA社内</title>
<style>
body{margin:0;background:#fff}
.dlab{position:sticky;top:0;z-index:60;background:#0f0f0f;color:#fff;padding:11px 18px;
  font:700 13px/1.5 system-ui,sans-serif;letter-spacing:.04em;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.dlab b{font-size:15px}
.dlab span{font-weight:400;color:#bdbdbd;font-size:12px}
/* 出現アニメのJSは動かさないので、最初から見えている状態にしておく */
.fv h1,.fv__sub,.fv__act,.fv .lab,.cut,.fv__enso,.fv__bg{opacity:1!important;transform:none!important}
.fv__scroll{display:none}
.fv{min-height:auto!important;padding:74px 0 84px!important}
.cut__tag i:first-child{opacity:0}
.cut__tag i:last-child{opacity:1;transform:none}
.cut__drop{width:0!important;overflow:hidden}
.fv__enso canvas{display:none}

/* ===== 案A：作ったサイトを、いちばん上に出す ===== */
.v-a .fv__grid{display:grid;grid-template-columns:1.04fr .96fr;gap:44px;align-items:center}
.v-a .fv__txt{grid-column:1}
.v-a .shot{grid-column:2;position:relative;z-index:2;border:1px solid #e4e4e2;background:#fff}
.v-a .shot__bar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid #e4e4e2;background:#f5f5f3}
.v-a .shot__bar i{width:7px;height:7px;border-radius:50%;background:#d7d7d3}
.v-a .shot__bar span{font-size:10.5px;color:#9a9a96;margin-left:8px;letter-spacing:.02em}
.v-a .shot img{display:block;width:100%;height:auto}
.v-a .shot__cap{font-size:11.5px;color:#767676;margin-top:10px;letter-spacing:.02em}
.fv.v-a .fv__enso{right:auto;left:-4%;top:4%;width:190px;opacity:.2!important;z-index:0;transform:none!important}
.fv.v-a h1{max-width:11em}
.v-a .cut{font-size:clamp(42px,6vw,88px)}
@media(max-width:900px){
  .v-a .fv__grid{grid-template-columns:1fr;gap:26px}
  .v-a .shot{grid-column:1}
  .fv.v-a .fv__enso{display:none}
}

/* ===== 案B：トップだけ墨ベタ ===== */
.v-b{background:#0f0f0f}
.fv.v-b .lab{color:#9e9e9a}
.fv.v-b h1{color:#fff}
.fv.v-b h1 em{color:#ff5a45}
.v-b .fv__sub{color:#b5b5b0}
.v-b .fv__sub b{color:#fff}
.v-b .cut{color:#fff}
.v-b .cut__yen{color:#8a8a86}
.v-b .cut__tag i:last-child{background:#ff5a45;color:#0f0f0f}
.v-b .fv__bg span{-webkit-text-stroke:1px #262624}
.v-b .btn{background:#fff;color:#0f0f0f}
.v-b .btn::before{background:#ff5a45}
.v-b .btn--line{background:none;color:#fff;border:1px solid #55554f}
.v-b .btn--line::before{background:#fff}

/* ===== 案C：文字を画面いっぱいに ===== */
.fv.v-c h1{font-size:clamp(38px,8.4vw,116px)!important;line-height:1.1;max-width:10em;letter-spacing:-.035em}
.v-c .cut{font-size:clamp(54px,11vw,164px)!important;margin-top:26px}
.v-c .fv__sub{margin-top:38px;font-size:16.5px}
.v-c .fv__bg span{font-size:clamp(90px,19vw,300px)!important;-webkit-text-stroke:1px #ececeb}
.fv.v-c .fv__enso{width:clamp(150px,20vw,300px)!important;opacity:.5!important;right:-4%}
</style>
</head><body>
<div id="out"><p style="padding:28px;font:400 14px/1.7 system-ui">読み込んでいます…</p></div>
<script>
(async function(){
  var html = await (await fetch("/", {cache:"no-store"})).text();
  var doc = new DOMParser().parseFromString(html, "text/html");
  // 本番のフォントとCSSをそのまま借りる
  doc.head.querySelectorAll('link[rel="stylesheet"],link[rel="preconnect"],style').forEach(function(n){
    document.head.insertBefore(n.cloneNode(true), document.head.firstChild);
  });
  var fv = doc.querySelector("section.fv");
  var out = document.getElementById("out"); out.innerHTML = "";
  function lab(b,s){ var d=document.createElement("div"); d.className="dlab";
    d.innerHTML='<b>'+b+'</b><span>'+s+'</span>'; out.appendChild(d); }
  function put(cls){
    var n = fv.cloneNode(true);
    n.querySelectorAll("canvas").forEach(function(c){c.remove();});
    if(cls){ n.classList.add(cls); }
    if(cls==="v-b"){ var im=n.querySelector(".fv__enso img"); if(im) im.src="assets/enso-light.webp"; }
    if(cls==="v-a"){
      var shot=document.createElement("div"); shot.className="shot";
      shot.innerHTML='<div class="shot__bar"><i></i><i></i><i></i><span>tatsunoya.example</span></div>'+
        '<img src="assets/work-01.jpg" alt="" width="1200" height="825">';
      var grid=n.querySelector(".fv__grid"), enso=n.querySelector(".fv__enso");
      grid.insertBefore(shot, enso);
    }
    out.appendChild(n);
  }
  lab("案A","作ったサイトを、いちばん上に出す");                 put("v-a");
  lab("案B","トップだけ墨ベタ（黒地）にして、コントラストで殴る"); put("v-b");
  lab("案C","文字を画面いっぱいまで大きくする");                 put("v-c");
  lab("いま","参考：現状のトップ");                               put("");
})();
</script>
</body></html>
